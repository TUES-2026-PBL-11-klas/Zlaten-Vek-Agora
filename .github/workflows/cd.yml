name: CD

# Build the api + web images and push them to GHCR, then roll them out via GitOps.
#   - push to main      -> :sha-<short>, :sha-<long>, :latest
#   - push of a v* tag  -> :sha-*, :<tag>, :<semver>, :<major.minor>
# On main, the `deploy` job pins the k8s manifests to the new :sha-<short> tag and
# commits back; ArgoCD (argocd/application.yaml) watches k8s/ and syncs to the cluster.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${owner_lc}/agora-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=agora-${{ matrix.image }}
            org.opencontainers.image.description=Agora ${{ matrix.image }} service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # ARGs only consumed by apps/web/Dockerfile; the api build silently ignores them.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Summary
        run: |
          {
            echo "### agora-${{ matrix.image }} image pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Roll manifests (GitOps)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: gitops-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "API_IMAGE=${REGISTRY}/${OWNER}/agora-api:sha-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${REGISTRY}/${OWNER}/agora-web:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Pin image tags in manifests
        run: |
          # The `g` flag rewrites both image lines in api-deployment.yaml (init + main).
          sed -i "s|image: ${REGISTRY}/${OWNER}/agora-api:.*|image: ${API_IMAGE}|g" k8s/api-deployment.yaml
          sed -i "s|image: ${REGISTRY}/${OWNER}/agora-web:.*|image: ${WEB_IMAGE}|g" k8s/web-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/api-deployment.yaml k8s/web-deployment.yaml
          git diff --cached --quiet || git commit -m "ci: roll images to sha-${SHORT_SHA} [skip ci]"
          git push origin main

  notify:
    name: Notify Discord (Failure)
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()
    steps:
      - name: Send failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          SHORT_SHA="${SHA::7}"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @- << EOF
          {
            "embeds": [{
              "title": "CD Failed - ${REPO}",
              "url": "${RUN_URL}",
              "description": "Docker image build/push failed.",
              "color": 15548997,
              "fields": [
                {"name": "Ref",          "value": "\`${REF}\`",                                                              "inline": true},
                {"name": "Commit",       "value": "[\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${REPO}/commit/${SHA})",          "inline": true},
                {"name": "Triggered by", "value": "${ACTOR}",                                                                "inline": true}
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": {"text": "Agora CD"}
            }]
          }
          EOF
