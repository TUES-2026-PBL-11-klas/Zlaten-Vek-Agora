name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agora/api db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agora/api db:generate
      - run: pnpm test

  notify:
    name: Notify Discord (Failure)
    runs-on: ubuntu-latest
    needs: [secrets-scan, lint, test]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RESULT_SECRETS: ${{ needs.secrets-scan.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TEST: ${{ needs.test.result }}
        run: |
          SHORT_SHA="${SHA::7}"
          FAILED=""
          [[ "$RESULT_SECRETS" == "failure" ]] && FAILED="${FAILED}• Secrets Scan\\n"
          [[ "$RESULT_LINT"    == "failure" ]] && FAILED="${FAILED}• Lint\\n"
          [[ "$RESULT_TEST"    == "failure" ]] && FAILED="${FAILED}• Unit Tests\\n"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @- << EOF
          {
            "embeds": [{
              "title": "CI Failed — ${REPO}",
              "url": "${RUN_URL}",
              "description": "**Failed jobs:**\n${FAILED}",
              "color": 15548997,
              "fields": [
                {"name": "Branch",        "value": "\`${BRANCH}\`",                                                           "inline": true},
                {"name": "Commit",        "value": "[\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${REPO}/commit/${SHA})", "inline": true},
                {"name": "Triggered by",  "value": "${ACTOR}",                                                                "inline": true}
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": {"text": "Agora CI"}
            }]
          }
          EOF

  notify-email:
    name: Notify Email (Failure)
    runs-on: ubuntu-latest
    needs: [secrets-scan, lint, test]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RESULT_SECRETS: ${{ needs.secrets-scan.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TEST: ${{ needs.test.result }}
        run: |
          SHORT_SHA="${SHA::7}"

          FAILED_LIST=""
          [[ "$RESULT_SECRETS" == "failure" ]] && FAILED_LIST="${FAILED_LIST}<li>Secrets Scan</li>"
          [[ "$RESULT_LINT"    == "failure" ]] && FAILED_LIST="${FAILED_LIST}<li>Lint</li>"
          [[ "$RESULT_TEST"    == "failure" ]] && FAILED_LIST="${FAILED_LIST}<li>Unit Tests</li>"

          HTML="<h2>CI Pipeline Failed</h2>
          <p><strong>Repository:</strong> ${REPO}</p>
          <p><strong>Branch:</strong> <code>${BRANCH}</code></p>
          <p><strong>Commit:</strong> <code>${SHORT_SHA}</code></p>
          <p><strong>Triggered by:</strong> ${ACTOR}</p>
          <p><strong>Failed jobs:</strong></p>
          <ul>${FAILED_LIST}</ul>
          <p><a href='${RUN_URL}'>View run on GitHub Actions</a></p>"

          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Agora CI <ci@agora-notifications.dev>\",
              \"to\": [\"${NOTIFY_EMAIL}\"],
              \"subject\": \"[CI] Failed: ${REPO} (${BRANCH} @ ${SHORT_SHA})\",
              \"html\": $(echo "$HTML" | jq -Rs .)
            }"
