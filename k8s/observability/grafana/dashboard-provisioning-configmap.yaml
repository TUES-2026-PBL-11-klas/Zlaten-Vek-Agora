apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: agora
        folder: Agora
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
