apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: discord
      group_by: [alertname]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h

    receivers:
      - name: discord
        # Discord exposes a Slack-compatible webhook at <webhook_url>/slack.
        # Set DISCORD_WEBHOOK_URL in the alertmanager-secrets Secret (see below).
        slack_configs:
          - api_url_file: /etc/alertmanager/discord_webhook_url
            channel: "#alerts"
            send_resolved: true
            title: |-
              {{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }}
              {{ .CommonAnnotations.summary }}
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Details:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              {{ end }}
