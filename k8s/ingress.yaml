apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agora-api
  namespace: agora
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: api
          port: 3000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agora-web
  namespace: agora
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 10
      services:
        - name: web
          port: 80
