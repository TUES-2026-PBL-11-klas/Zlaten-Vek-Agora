apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agora
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        - name: prisma-migrate
          image: ghcr.io/tues-2026-pbl-11-klas/agora-api:sha-14842d5
          workingDir: /app/apps/api
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: DIRECT_URL
      containers:
        - name: api
          image: ghcr.io/tues-2026-pbl-11-klas/agora-api:sha-14842d5
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: DIRECT_URL
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: SUPABASE_JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agora-secrets
                  key: OPENAI_API_KEY
            - name: PORT
              value: "3000"
