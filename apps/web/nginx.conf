server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip text assets (nginx-alpine ships with gzip module compiled in).
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Vite emits hashed asset filenames under /assets - cache them aggressively.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Never cache the HTML shell, otherwise stale builds get pinned in browsers.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Liveness probe target for the container HEALTHCHECK / k8s readiness probes.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return     200 "ok\n";
    }

    # SPA history fallback - unknown routes serve index.html and let the
    # client-side router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
